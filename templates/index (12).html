<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI</title>

<style>
body{
    margin:0;
    height:100vh;
    display:grid;
    place-items:center;
    background:#111;
    color:white;
    font-family:Arial;
}

.card{
    width:400px;
    padding:25px;
    text-align:center;
    background:#222;
    border:1px solid #444;
    border-radius:10px;
}

.mic{
    width:75px;
    height:75px;
    border:0;
    border-radius:50%;
    font-size:30px;
    cursor:pointer;
    background:#eee;
}

.mic.listening{
    background:#aaa;
}

.status{
    margin:15px;
    color:#aaa;
}

.command{
    margin:10px;
    color:#ccc;
}

.editor{
    display:none;
    margin-top:20px;
    text-align:left;
}

.recipient{
    color:#aaa;
    font-size:13px;
}

input,textarea{
    width:100%;
    margin:6px 0;
    padding:10px;
    box-sizing:border-box;
    background:#111;
    color:white;
    border:1px solid #444;
    border-radius:5px;
}

textarea{
    height:130px;
    resize:vertical;
}

button.action{
    padding:10px 14px;
    margin-top:5px;
    border:0;
    border-radius:5px;
    cursor:pointer;
}

.primary{
    background:#666;
    color:white;
}
</style>
</head>

<body>

<div class="card">

<h2>Nova AI</h2>

<p>Say a song name or create an email</p>

<button id="mic" class="mic">🎙️</button>

<div id="status" class="status">
    Tap microphone
</div>

<div id="command" class="command"></div>


<!-- Gmail Editor -->

<div id="editor" class="editor">

    <div id="recipient" class="recipient"></div>

    <input id="subject"
           placeholder="Email subject">

    <textarea id="body"
              placeholder="Email body"></textarea>

    <button id="open"
            class="action primary">
        Open in Gmail
    </button>

    <button id="regen"
            class="action">
        Regenerate
    </button>

</div>

</div>


<script>

const $=id=>document.getElementById(id);

const mic=$("mic");
const status=$("status");
const commandBox=$("command");

const editor=$("editor");
const recipient=$("recipient");
const subject=$("subject");
const body=$("body");

const SR=
    window.SpeechRecognition||
    window.webkitSpeechRecognition;

let recognition;
let listening=false;
let lastCommand="";
let youtubeTab=null;


// Speech Recognition

if(!SR){

    status.textContent=
        "Speech recognition unavailable";

    mic.disabled=true;

}else{

    recognition=new SR();

    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=false;


    recognition.onstart=()=>{

        listening=true;

        mic.classList.add("listening");

        status.textContent=
            "Listening...";
    };


    recognition.onend=()=>{

        listening=false;

        mic.classList.remove("listening");
    };


    recognition.onerror=e=>{

        listening=false;

        mic.classList.remove("listening");

        status.textContent=
            "Voice error: "+e.error;
    };


    recognition.onresult=e=>{

        const text=
            e.results[0][0]
            .transcript
            .trim();

        if(!text){

            status.textContent=
                "No command detected";

            return;
        }

        lastCommand=text;

        commandBox.textContent=text;

        processCommand(text);
    };


    mic.onclick=()=>{

        if(listening)return;

        try{
            recognition.start();
        }catch(e){
            console.log(e);
        }

    };

}


// Gmail command detection

function isGmail(command){

    return /email|mail|gmail|send|compose|write.*email/i
        .test(command);
}


// Main command processor

async function processCommand(command){

    const gmail=isGmail(command);

    status.textContent=
        gmail
        ?"Generating email..."
        :"Finding song...";

    try{

        const response=await fetch(
            gmail
            ?"/agent"
            :"/youtube/play",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    command:command
                })
            }
        );

        const data=
            await response.json();

        if(!response.ok||!data.success){

            throw Error(
                data.message||
                "Request failed"
            );
        }


        if(gmail){

            showEmail(data);

        }else{

            playYouTube(data);

        }

    }catch(error){

        console.error(error);

        status.textContent=
            error.message||
            "Server connection failed";
    }
}


// Show generated email

function showEmail(data){

    recipient.dataset.email=
        data.recipient||"";

    recipient.textContent=
        data.recipient
        ?"To: "+data.recipient
        :"Recipient not specified";

    subject.value=
        data.subject||"";

    body.value=
        data.body||"";

    editor.style.display="block";

    status.textContent=
        "Email ready. Review or edit it.";
}


// Open Gmail

$("open").onclick=()=>{

    const url=
        "https://mail.google.com/mail/u/0/?"+
        new URLSearchParams({

            view:"cm",
            fs:"1",

            to:
                recipient.dataset.email||"",

            su:
                subject.value,

            body:
                body.value
        });

    const win=
        window.open(
            url,
            "NovaGmail"
        );

    if(!win){

        status.textContent=
            "Please allow popups for this site.";
    }
};


// Regenerate email

$("regen").onclick=()=>{

    if(lastCommand)
        processCommand(lastCommand);
};


// YouTube playback

function playYouTube(data){

    if(!youtubeTab||
       youtubeTab.closed){

        youtubeTab=
            window.open(
                data.url,
                "NovaYouTube"
            );

    }else{

        youtubeTab.location.href=
            data.url;

        youtubeTab.focus();
    }

    status.textContent="Playing";
}

</script>

</body>
</html>
