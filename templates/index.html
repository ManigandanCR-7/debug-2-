<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Nova-Code Tester | Next-Gen Code Inspector</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #18202b 0%, #0d1117 35%, #090d12 100%);
      color: #e6edf3;
      font-family: "Inter", sans-serif;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid #30363d;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #21262d;
      border: 1px solid #30363d;
      font-weight: 700;
      color: #58a6ff;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .brand span {
      color: #8b949e;
      font-size: 12px;
    }

    .container {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
      gap: 18px;
      padding: 20px;
      max-width: 1800px;
      margin: auto;
    }

    .editors-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .editor-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #0d1117;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .editor-card.full-width {
      grid-column: 1 / -1;
    }

    .editor-header {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #30363d;
      background: #161b22;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .file-icon {
      color: #58a6ff;
      font-family: "Fira Code", monospace;
      font-size: 13px;
    }

    .file-name {
      font-family: "Fira Code", monospace;
      font-size: 12px;
      color: #c9d1d9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .editor-actions {
      display: flex;
      gap: 7px;
    }

    .editor-actions button {
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 11px;
      transition: 0.2s ease;
    }

    .editor-actions button:hover {
      background: #30363d;
      border-color: #484f58;
    }

    .editor-actions .run-btn {
      color: #7ee787;
    }

    .editor-actions .fix-btn {
      color: #79c0ff;
    }

    .editor-status {
      min-height: 25px;
      padding: 5px 12px;
      border-bottom: 1px solid #21262d;
      color: #8b949e;
      font-size: 10px;
      font-family: "Fira Code", monospace;
    }

    .editor-status.success {
      color: #7ee787;
    }

    .editor-status.error {
      color: #f85149;
    }

    .editor-wrapper {
      position: relative;
      display: flex;
      height: 390px;
      background: #0d1117;
      overflow: hidden;
    }

    .line-numbers {
      width: 48px;
      padding: 14px 8px;
      overflow: hidden;
      text-align: right;
      user-select: none;
      color: #484f58;
      background: #0d1117;
      border-right: 1px solid #21262d;
      font-family: "Fira Code", monospace;
      font-size: 12px;
      line-height: 20px;
      white-space: pre;
    }

    textarea.code-editor {
      flex: 1;
      width: 100%;
      height: 100%;
      resize: none;
      outline: none;
      border: 0;
      padding: 14px;
      background: #0d1117;
      color: #c9d1d9;
      font-family: "Fira Code", monospace;
      font-size: 12px;
      line-height: 20px;
      tab-size: 4;
      white-space: pre;
      overflow: auto;
    }

    textarea.code-editor::selection {
      background: #264f78;
    }

    .results-panel {
      position: sticky;
      top: 90px;
      align-self: start;
      min-height: 500px;
      max-height: calc(100vh - 110px);
      overflow: auto;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #0d1117;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .results-header {
      padding: 16px;
      border-bottom: 1px solid #30363d;
      background: #161b22;
    }

    .results-header h2 {
      margin: 0;
      font-size: 15px;
    }

    .results-header p {
      margin: 5px 0 0;
      color: #8b949e;
      font-size: 11px;
    }

    #resultsContainer {
      padding: 15px;
    }

    .empty-result {
      padding: 30px 15px;
      text-align: center;
      color: #6e7681;
      font-size: 12px;
    }

    .result-card {
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
    }

    .result-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result-success {
      color: #7ee787;
    }

    .result-error {
      color: #f85149;
    }

    .error-item {
      margin-top: 8px;
      padding: 9px;
      border-radius: 6px;
      background: #1c1214;
      border: 1px solid #4a1f24;
      color: #ff7b72;
      font-family: "Fira Code", monospace;
      font-size: 11px;
      line-height: 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error-label {
      color: #ffa198;
      font-weight: 600;
    }

    .loading {
      color: #79c0ff;
    }

    @media (max-width: 1100px) {

      .container {
        grid-template-columns: 1fr;
      }

      .results-panel {
        position: static;
        max-height: none;
      }

      .editors-grid {
        grid-template-columns: 1fr;
      }

      .editor-card.full-width {
        grid-column: auto;
      }

    }

    @media (max-width: 600px) {

      header {
        padding: 0 15px;
      }

      .container {
        padding: 12px;
      }

      .editor-header {
        padding: 0 10px;
      }

      .editor-actions button {
        padding: 5px 7px;
      }

    }

  </style>

</head>


<body>

<header>

  <div class="brand">

    <div class="logo">
      N
    </div>

    <div>
      <h1>Nova Debug</h1>
      <span>Next-Gen Code Inspector</span>
    </div>

  </div>

</header>


<div class="container">

  <main class="editors-grid">


    <!-- ========================================================= -->
    <!-- EDITOR 1 -->
    <!-- ========================================================= -->

    <section class="editor-card">

      <div class="editor-header">

        <div class="file-info">

          <span class="file-icon">PY</span>

          <span class="file-name">
            gmail/__init__.py
          </span>

        </div>

        <div class="editor-actions">

          <button class="run-btn"
                  onclick="runDebugger(1)">
            Run
          </button>

          <button class="fix-btn"
                  onclick="fixCode(1)">
            Fix
          </button>

        </div>

      </div>

      <div id="editorStatus1"
           class="editor-status">
        Ready
      </div>

      <div class="editor-wrapper">

        <div id="lineNumbers1"
             class="line-numbers">
          1
        </div>

        <textarea
          id="codeEditor1"
          class="code-editor"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"></textarea>

      </div>

    </section>


    <!-- ========================================================= -->
    <!-- EDITOR 2 -->
    <!-- ========================================================= -->

    <section class="editor-card">

      <div class="editor-header">

        <div class="file-info">

          <span class="file-icon">PY</span>

          <span class="file-name">
            gmail/gmail_gen.py
          </span>

        </div>

        <div class="editor-actions">

          <button class="run-btn"
                  onclick="runDebugger(2)">
            Run
          </button>

          <button class="fix-btn"
                  onclick="fixCode(2)">
            Fix
          </button>

        </div>

      </div>

      <div id="editorStatus2"
           class="editor-status">
        Ready
      </div>

      <div class="editor-wrapper">

        <div id="lineNumbers2"
             class="line-numbers">
          1
        </div>

        <textarea
          id="codeEditor2"
          class="code-editor"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"></textarea>

      </div>

    </section>


    <!-- ========================================================= -->
    <!-- EDITOR 3 -->
    <!-- ========================================================= -->

    <section class="editor-card">

      <div class="editor-header">

        <div class="file-info">

          <span class="file-icon">PY</span>

          <span class="file-name">
            gmail/gmail_write.py
          </span>

        </div>

        <div class="editor-actions">

          <button class="run-btn"
                  onclick="runDebugger(3)">
            Run
          </button>

          <button class="fix-btn"
                  onclick="fixCode(3)">
            Fix
          </button>

        </div>

      </div>

      <div id="editorStatus3"
           class="editor-status">
        Ready
      </div>

      <div class="editor-wrapper">

        <div id="lineNumbers3"
             class="line-numbers">
          1
        </div>

        <textarea
          id="codeEditor3"
          class="code-editor"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"></textarea>

      </div>

    </section>


    <!-- ========================================================= -->
    <!-- EDITOR 4 -->
    <!-- ========================================================= -->

    <section class="editor-card">

      <div class="editor-header">

        <div class="file-info">

          <span class="file-icon">PY</span>

          <span class="file-name">
            app/__init__.py
          </span>

        </div>

        <div class="editor-actions">

          <button class="run-btn"
                  onclick="runDebugger(4)">
            Run
          </button>

          <button class="fix-btn"
                  onclick="fixCode(4)">
            Fix
          </button>

        </div>

      </div>

      <div id="editorStatus4"
           class="editor-status">
        Ready
      </div>

      <div class="editor-wrapper">

        <div id="lineNumbers4"
             class="line-numbers">
          1
        </div>

        <textarea
          id="codeEditor4"
          class="code-editor"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"></textarea>

      </div>

    </section>


    <!-- ========================================================= -->
    <!-- EDITOR 5 -->
    <!-- ========================================================= -->

    <section class="editor-card full-width">

      <div class="editor-header">

        <div class="file-info">

          <span class="file-icon">HTML</span>

          <span class="file-name">
            templates/index.html
          </span>

        </div>

        <div class="editor-actions">

          <button class="run-btn"
                  onclick="runDebugger(5)">
            Run
          </button>

          <button class="fix-btn"
                  onclick="fixCode(5)">
            Fix
          </button>

        </div>

      </div>

      <div id="editorStatus5"
           class="editor-status">
        Ready
      </div>

      <div class="editor-wrapper">

        <div id="lineNumbers5"
             class="line-numbers">
          1
        </div>

        <textarea
          id="codeEditor5"
          class="code-editor"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"></textarea>

      </div>

    </section>


  </main>


  <!-- ========================================================= -->
  <!-- RESULTS -->
  <!-- ========================================================= -->

  <aside class="results-panel">

    <div class="results-header">

      <h2>
        Debug Results
      </h2>

      <p>
        Compare your code with the expected project structure.
      </p>

    </div>

    <div id="resultsContainer">

      <div class="empty-result">
        Run an editor to inspect the result.
      </div>

    </div>

  </aside>


</div>


<script>

const editorCount = 5;

const editors = [];
const lineNumbers = [];
const editorStatuses = [];

for(let i = 1; i <= editorCount; i++){

  editors.push(
    document.getElementById(
      `codeEditor${i}`
    )
  );

  lineNumbers.push(
    document.getElementById(
      `lineNumbers${i}`
    )
  );

  editorStatuses.push(
    document.getElementById(
      `editorStatus${i}`
    )
  );

}


/* =========================================================
   FILE NAMES
   ========================================================= */

const fileNames = {

  1: "gmail/__init__.py",

  2: "gmail/gmail_gen.py",

  3: "gmail/gmail_write.py",

  4: "app/__init__.py",

  5: "templates/index.html"

};


/* =========================================================
   LINE NUMBERS
   ========================================================= */

function updateLineNumbers(index){

  const editor = editors[index - 1];
  const numbers = lineNumbers[index - 1];

  if(!editor || !numbers)return;

  const lineCount =
    editor.value.split("\n").length;

  let output = "";

  for(let i = 1; i <= lineCount; i++){

    output += i + "\n";

  }

  numbers.textContent =
    output;

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  index,
  message,
  type = ""
){

  const status =
    editorStatuses[index - 1];

  if(!status)return;

  status.textContent =
    message;

  status.className =
    "editor-status";

  if(type){

    status.classList.add(type);

  }

}


/* =========================================================
   EDITOR INPUT
   ========================================================= */

editors.forEach((editor, position) => {

  if(!editor)return;

  const index =
    position + 1;


  editor.addEventListener(
    "input",
    () => {

      updateLineNumbers(index);

      setStatus(
        index,
        "Modified"
      );

    }
  );


  editor.addEventListener(
    "scroll",
    () => {

      lineNumbers[index - 1].scrollTop =
        editor.scrollTop;

    }
  );


  editor.addEventListener(
    "keydown",
    event => {

      if(event.key === "Tab"){

        event.preventDefault();

        const start =
          editor.selectionStart;

        const end =
          editor.selectionEnd;

        editor.value =
          editor.value.substring(
            0,
            start
          ) +
          "    " +
          editor.value.substring(
            end
          );

        editor.selectionStart =
          editor.selectionEnd =
            start + 4;

        updateLineNumbers(index);

        setStatus(
          index,
          "Modified"
        );

      }

    }
  );


  updateLineNumbers(index);

});


/* =========================================================
   LOAD TEMPLATE CODE
   ========================================================= */

async function loadTemplateCode(){

  try{

    const response =
      await fetch("/template");

    if(!response.ok){

      throw new Error(
        "Template endpoint unavailable"
      );

    }

    const data =
      await response.json();


    if(
      !data.success ||
      !data.templates
    ){

      throw new Error(
        "Invalid template response"
      );

    }


    for(let i = 1; i <= editorCount; i++){

      const code =
        data.templates[
          `editor${i}`
        ];

      if(
        code !== undefined &&
        editors[i - 1]
      ){

        editors[i - 1].value =
          code;

        updateLineNumbers(i);

        setStatus(
          i,
          "Loaded"
        );

      }

    }

  }catch(error){

    console.error(
      "Template loading error:",
      error
    );

    setStatus(
      1,
      "Template loading failed",
      "error"
    );

  }

}


/* =========================================================
   RUN DEBUGGER
   ========================================================= */

async function runDebugger(index){

  const editor =
    editors[index - 1];

  if(!editor)return;


  const inputCode =
    editor.value;


  setStatus(
    index,
    "Running...",
    "loading"
  );


  addResult(
    index,
    "Checking code...",
    "loading"
  );


  try{

    const response =
      await fetch(
        "/compare",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            editor_id: index,

            input_code:
              inputCode

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        "Debugger request failed"
      );

    }


    if(data.match){

      setStatus(
        index,
        "Code matches",
        "success"
      );

      addResult(
        index,
        "✓ Code matches the expected version.",
        "success"
      );

    }else{

      setStatus(
        index,
        "Issues found",
        "error"
      );

      renderErrors(
        index,
        data.errors || []
      );

    }


  }catch(error){

    console.error(error);

    setStatus(
      index,
      error.message ||
      "Debugger failed",
      "error"
    );


    addResult(
      index,
      error.message ||
      "Debugger failed",
      "error"
    );

  }

}


/* =========================================================
   ADD RESULT
   ========================================================= */

function addResult(
  index,
  message,
  type = ""
){

  const container =
    document.getElementById(
      "resultsContainer"
    );


  const empty =
    container.querySelector(
      ".empty-result"
    );

  if(empty){

    empty.remove();

  }


  const card =
    document.createElement(
      "div"
    );

  card.className =
    "result-card";


  const title =
    document.createElement(
      "div"
    );

  title.className =
    "result-title " +
    (
      type === "error"
        ? "result-error"
        : type === "success"
          ? "result-success"
          : ""
    );


  title.textContent =
    `${index}. ${fileNames[index]}`;


  const content =
    document.createElement(
      "div"
    );

  content.style.fontSize =
    "11px";

  content.style.color =
    "#8b949e";

  content.textContent =
    message;


  card.appendChild(title);

  card.appendChild(content);

  container.prepend(card);

}


/* =========================================================
   RENDER ERRORS
   ========================================================= */

function renderErrors(
  index,
  errors
){

  const container =
    document.getElementById(
      "resultsContainer"
    );


  const empty =
    container.querySelector(
      ".empty-result"
    );

  if(empty){

    empty.remove();

  }


  const card =
    document.createElement(
      "div"
    );

  card.className =
    "result-card";


  const title =
    document.createElement(
      "div"
    );

  title.className =
    "result-title result-error";

  title.textContent =
    `${index}. ${fileNames[index]} — Issues`;


  card.appendChild(title);


  if(!errors.length){

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "error-item";

    item.textContent =
      "Code does not match the expected version.";

    card.appendChild(item);

  }else{

    errors.forEach(error => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "error-item";


      if(typeof error === "string"){

        item.textContent =
          error;

      }else{

        let output = "";


        if(error.type){

          output +=
            "Type: " +
            error.type +
            "\n";

        }


        if(error.line){

          output +=
            "Line: " +
            error.line +
            "\n";

        }


        if(error.message){

          output +=
            error.message +
            "\n";

        }


        if(error.expected){

          output +=
            "Expected: " +
            error.expected +
            "\n";

        }


        if(error.found){

          output +=
            "Found: " +
            error.found +
            "\n";

        }


        if(error.expected_line){

          output +=
            "Expected line: " +
            error.expected_line +
            "\n";

        }


        if(error.found_line){

          output +=
            "Found line: " +
            error.found_line +
            "\n";

        }


        if(!output){

          output =
            JSON.stringify(
              error,
              null,
              2
            );

        }


        item.textContent =
          output.trim();

      }


      card.appendChild(item);

    });

  }


  container.prepend(card);

}


/* =========================================================
   FIX CODE
   ========================================================= */

async function fixCode(index){

  const editor =
    editors[index - 1];

  if(!editor)return;


  setStatus(
    index,
    "Applying fix...",
    "loading"
  );


  try{

    const response =
      await fetch(
        "/fix",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            editor_id: index

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        "Fix request failed"
      );

    }


    if(
      !data.fixed_code &&
      data.fixed_code !== ""
    ){

      throw new Error(
        "No fixed code returned"
      );

    }


    editor.value =
      data.fixed_code;


    updateLineNumbers(index);


    setStatus(
      index,
      "Fixed",
      "success"
    );


    addResult(
      index,
      "✓ Fixed code loaded into the editor.",
      "success"
    );


  }catch(error){

    console.error(error);

    setStatus(
      index,
      error.message ||
      "Fix failed",
      "error"
    );


    addResult(
      index,
      error.message ||
      "Fix failed",
      "error"
    );

  }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   INITIALIZE
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    loadTemplateCode();

  }
);

</script>
